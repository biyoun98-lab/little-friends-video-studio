services:
  - type: web
    name: little-friends-video-studio
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: FAL_KEY
        sync: false
      - key: AI_ACCESS_CODE
        sync: false
