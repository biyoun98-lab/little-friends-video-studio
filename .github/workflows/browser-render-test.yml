name: Browser video export test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright and FFmpeg
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Create artifact directory
        run: mkdir -p artifacts
      - name: Render and inspect a real video
        run: node tests/browser-render-test.mjs
      - name: Upload rendered test video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: little-friends-browser-render-test
          path: artifacts/
          if-no-files-found: ignore
